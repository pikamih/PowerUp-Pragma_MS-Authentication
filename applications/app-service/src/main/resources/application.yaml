server:
  port: 8080

spring:
  application:
    name: "MS_Authentication"
  profiles:
    active: "devkpika"
  r2dbc:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  main:
    allow-bean-definition-overriding: true

  security:
    user:
      name: admin
      password: admin123

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/v1/**


security:
  jwt:
    private-key-path: ${JWT_PRAGMA_PRIVATE_KEY}
    public-key-path: ${JWT_PRAGMA_PUBLIC_KEY}
    expiration: 3600 #en segundos

app:
  initial:
    admin:
      email: ${APP_INITIAL_ADMIN_EMAIL}
      password: ${APP_INITIAL_ADMIN_PASSWORD}

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.http.converter.json: DEBUG
    com.fasterxml.jackson.databind: DEBUG
