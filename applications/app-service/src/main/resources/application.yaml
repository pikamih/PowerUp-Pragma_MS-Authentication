server:
  port: 8080

spring:
  application:
    name: "MS_Authentication"

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/authentication_db
    username: postgres
    password: root
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  main:
    allow-bean-definition-overriding: true

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret-key: ""
    expiration: 3600 #en segundos

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.http.converter.json: DEBUG
    com.fasterxml.jackson.databind: DEBUG
